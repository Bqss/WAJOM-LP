<!doctype html>
<html lang="ms" data-theme="dark" data-locale="ms">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/logo.png" />
		<meta name="color-scheme" content="dark light" />
		<script>
			(function () {
				try {
					var theme = localStorage.getItem("wajom-theme");
					if (!theme) { theme = "dark"; }
					document.documentElement.setAttribute("data-theme", theme);

					var language = localStorage.getItem("wajom-language");
					if (language !== "ms" && language !== "en") { language = "ms"; }
					document.documentElement.lang = language;
					document.documentElement.dataset.locale = language;
				} catch (e) {
					document.documentElement.setAttribute("data-theme", "dark");
					document.documentElement.lang = "ms";
					document.documentElement.dataset.locale = "ms";
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
